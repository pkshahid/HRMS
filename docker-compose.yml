services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance_admin
      POSTGRES_PASSWORD: attendance_pass_2024
      POSTGRES_DB: attendance_db
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - attendance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_admin -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  attendance_pgdata:
